spring:
  application:
    name: lucky-draw-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lucky_draw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:lucky}
    password: ${DB_PASSWORD:lucky}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
