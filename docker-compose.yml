services:
  mysql:
    image: mysql:8.4
    container_name: lucky-draw-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lucky_draw
      MYSQL_USER: lucky
      MYSQL_PASSWORD: lucky
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - lucky-draw-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: lucky-draw-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lucky_draw?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: lucky
      DB_PASSWORD: lucky
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  h5:
    build:
      context: ./h5
    container_name: lucky-draw-h5
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  lucky-draw-mysql:
